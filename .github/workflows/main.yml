name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Setup Java JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Install Dependencies
      run: npm install

    - name: Build Web Assets
      run: npm run build

    - name: Setup & Add Capacitor Android Platform
      run: |
        npm install @capacitor/core @capacitor/cli @capacitor/android
        npx cap init "NAFI TV 24" "com.nafitv24.app" --web-dir dist || true
        rm -rf android
        npx cap add android
        npx cap sync android

    - name: Force Java 21 & SDK 35 Across All Modules
      run: |
        node -e '
          const fs = require("fs");
          
          // 1. variables.gradle-এ SDK ও Java ভার্সন আপডেট
          const varsGradle = "android/variables.gradle";
          if (fs.existsSync(varsGradle)) {
            let content = fs.readFileSync(varsGradle, "utf8");
            content = content.replace(/minSdkVersion\s*=\s*\d+/g, "minSdkVersion = 22");
            content = content.replace(/compileSdkVersion\s*=\s*\d+/g, "compileSdkVersion = 35");
            content = content.replace(/targetSdkVersion\s*=\s*\d+/g, "targetSdkVersion = 35");
            fs.writeFileSync(varsGradle, content);
          }

          // 2. Main App build.gradle
          const appGradle = "android/app/build.gradle";
          if (fs.existsSync(appGradle)) {
            let content = fs.readFileSync(appGradle, "utf8");
            content = content.replace(/sourceCompatibility JavaVersion\.VERSION_\d+/g, "sourceCompatibility JavaVersion.VERSION_21");
            content = content.replace(/targetCompatibility JavaVersion\.VERSION_\d+/g, "targetCompatibility JavaVersion.VERSION_21");
            fs.writeFileSync(appGradle, content);
          }

          // 3. Node Modules-এর Capacitor Android Library-তেও Java 21 সেট করা
          const capGradle = "node_modules/@capacitor/android/capacitor/build.gradle";
          if (fs.existsSync(capGradle)) {
            let content = fs.readFileSync(capGradle, "utf8");
            content = content.replace(/sourceCompatibility JavaVersion\.VERSION_\d+/g, "sourceCompatibility JavaVersion.VERSION_21");
            content = content.replace(/targetCompatibility JavaVersion\.VERSION_\d+/g, "targetCompatibility JavaVersion.VERSION_21");
            fs.writeFileSync(capGradle, content);
          }
        '

    - name: Fix Android Manifest Queries
      run: |
        MANIFEST="android/app/src/main/AndroidManifest.xml"
        if [ -f "$MANIFEST" ]; then
          node -e '
            const fs = require("fs");
            const file = "android/app/src/main/AndroidManifest.xml";
            let content = fs.readFileSync(file, "utf8");
            if (!content.includes("<queries>")) {
              const queries = `\n    <queries>\n        <package android:name="com.mxtech.videoplayer.ad" />\n        <package android:name="com.mxtech.videoplayer.pro" />\n        <package android:name="org.videolan.vlc" />\n        <intent>\n            <action android:name="android.intent.action.VIEW" />\n            <data android:mimeType="video/*" />\n        </intent>\n        <intent>\n            <action android:name="android.intent.action.VIEW" />\n            <data android:scheme="http" />\n        </intent>\n        <intent>\n            <action android:name="android.intent.action.VIEW" />\n            <data android:scheme="https" />\n        </intent>\n    </queries>\n</manifest>`;
              content = content.replace("</manifest>", queries);
              fs.writeFileSync(file, content);
            }
          '
        fi

    - name: Build Android Debug APK
      run: |
        cd android
        if [ ! -f "gradlew" ]; then
          gradle wrapper
        fi
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NAFI-TV-24-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
