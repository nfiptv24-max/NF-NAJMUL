name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Install Dependencies
      run: npm install

    - name: Build Web Assets
      run: npm run build

    - name: Add & Sync Capacitor Android
      run: |
        npm install @capacitor/core @capacitor/cli @capacitor/android
        npx cap init "NAFI TV 24" "com.nafitv24.app" --web-dir dist || true
        npx cap add android || true
        npx cap sync android

    - name: Fix Android Manifest Queries
      run: |
        MANIFEST="android/app/src/main/AndroidManifest.xml"
        if [ -f "$MANIFEST" ]; then
          node -e '
            const fs = require("fs");
            const file = "android/app/src/main/AndroidManifest.xml";
            let content = fs.readFileSync(file, "utf8");
            if (!content.includes("<queries>")) {
              const queries = `\n    <queries>\n        <package android:name="com.mxtech.videoplayer.ad" />\n        <package android:name="com.mxtech.videoplayer.pro" />\n        <package android:name="org.videolan.vlc" />\n        <intent>\n            <action android:name="android.intent.action.VIEW" />\n            <data android:mimeType="video/*" />\n        </intent>\n        <intent>\n            <action android:name="android.intent.action.VIEW" />\n            <data android:scheme="http" />\n        </intent>\n        <intent>\n            <action android:name="android.intent.action.VIEW" />\n            <data android:scheme="https" />\n        </intent>\n    </queries>\n</manifest>`;
              content = content.replace("</manifest>", queries);
              fs.writeFileSync(file, content);
            }
          '
        fi

    - name: Build Android Debug APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NAFI-TV-24-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
