name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Dependencies
      run: |
        npm ci || npm install

    - name: Build Web Assets
      run: npm run build

    - name: Add & Sync Capacitor Android
      run: |
        npm install @capacitor/core @capacitor/cli @capacitor/android
        npx cap init "NAFI TV 24" "com.nafitv24.app" --web-dir dist || true
        npx cap add android || true
        npx cap sync android

    - name: Ensure Android Manifest Queries Exists
      run: |
        MANIFEST="android/app/src/main/AndroidManifest.xml"
        if [ -f "$MANIFEST" ]; then
          if ! grep -q "<queries>" "$MANIFEST"; then
            sed -i 's|</manifest>|<queries><package android:name="com.mxtech.videoplayer.ad"/><package android:name="com.mxtech.videoplayer.pro"/><package android:name="org.videolan.vlc"/><intent><action android:name="android.intent.action.VIEW"/><data android:mimeType="video/*"/></intent><intent><action android:name="android.intent.action.VIEW"/><data android:scheme="http"/></intent><intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent></queries></manifest>|g' "$MANIFEST"
          fi
        fi

    - name: Fix Kotlin & Gradle Settings
      run: |
        echo "android.packaging.jniLibs.useLegacyPackaging=true" >> android/gradle.properties
        echo "configurations.all { resolutionStrategy { force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22', 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22' } }" >> android/app/build.gradle

    - name: Build Android Debug APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NAFI-TV-24-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
