Name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 20

    - name: Setup Java JDK
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Clean Dependencies & Cache
      run: |
        rm -rf package-lock.json node_modules

    - name: Install Dependencies
      run: npm install

    - name: Add Capacitor Android
      run: |
        npm install @capacitor/core @capacitor/cli @capacitor/android
        npx cap init "NAFI TV 24" "com.nafitv24.app" --web-dir dist || true

    - name: Build Web Assets
      run: npm run build

    - name: Sync Capacitor Android
      run: |
        npx cap add android || true
        npx cap sync android

    # 🚀 নতুন যুক্ত করা হয়েছে: Android Manifest-এ External Players-এর পারমিশন যুক্ত করার স্টেপ
    - name: Inject Android Permissions & Queries
      run: |
        MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
        if [ -f "$MANIFEST_PATH" ]; then
          # Queries ইনজেকশন করার কোড
          QUERIES='<queries>\n        <package android:name="com.mxtech.videoplayer.ad" />\n        <package android:name="com.mxtech.videoplayer.pro" />\n        <package android:name="org.videolan.vlc" />\n        <intent>\n            <action android:name="android.intent.action.VIEW" />\n            <data android:mimeType="video/*" />\n        </intent>\n        <intent>\n            <action android:name="android.intent.action.VIEW" />\n            <data android:scheme="http" />\n        </intent>\n        <intent>\n            <action android:name="android.intent.action.VIEW" />\n            <data android:scheme="https" />\n        </intent>\n    </queries>'
          
          # Manifest ফাইলে Queries বসিয়ে দেওয়া
          sed -i "s|</manifest>|${QUERIES}\n</manifest>|" $MANIFEST_PATH
          echo "Successfully injected permissions and external player queries into AndroidManifest.xml"
        fi

    - name: Fix Kotlin Conflict
      run: |
        echo "android.packaging.jniLibs.useLegacyPackaging=true" >> android/gradle.properties
        echo "configurations.all { resolutionStrategy { force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22', 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22' } }" >> android/app/build.gradle

    - name: Build Android Debug APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NAFI-TV-24-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
